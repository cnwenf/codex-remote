name: Release Codex Remote

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    # The existing release gate includes macOS LaunchAgent/runtime integration tests.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  macos:
    needs: verify
    strategy:
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch verified public HTTPS helper
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fetch-cloudflared.sh "${{ matrix.arch }}" "$RUNNER_TEMP/cloudflared"
      - name: Build architecture-specific DMG
        run: |
          export CODEX_REMOTE_NODE_BIN="$(command -v node)"
          export CODEX_REMOTE_CLOUDFLARED_BIN="$RUNNER_TEMP/cloudflared"
          export MACOS_ARCH="${{ matrix.arch }}"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            export VERSION="${GITHUB_REF_NAME#v}"
          else
            export VERSION="$(node -p "require('./package.json').version")"
          fi
          scripts/package-macos-dmg.sh
      - name: Verify package
        run: |
          (cd artifacts && shasum -a 256 -c "Codex-Remote-${{ matrix.arch }}.dmg.sha256")
          mount_dir="$(mktemp -d)"
          hdiutil attach "artifacts/Codex-Remote-${{ matrix.arch }}.dmg" -nobrowse -readonly -mountpoint "$mount_dir" -quiet
          codesign --verify --deep --strict "$mount_dir/Codex Remote.app"
          file "$mount_dir/Codex Remote.app/Contents/MacOS/Codex Remote" | grep -q "${{ matrix.arch }}"
          file "$mount_dir/Codex Remote.app/Contents/Resources/bin/node" | grep -q "${{ matrix.arch }}"
          file "$mount_dir/Codex Remote.app/Contents/Resources/bin/cloudflared" | grep -q "${{ matrix.arch }}"
          "$mount_dir/Codex Remote.app/Contents/MacOS/Codex Remote" --self-test
          hdiutil detach "$mount_dir" -quiet
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            artifacts/Codex-Remote-${{ matrix.arch }}.dmg
            artifacts/Codex-Remote-${{ matrix.arch }}.dmg.sha256

  android:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - run: pnpm install --frozen-lockfile
      - run: pnpm mobile:sync
      - name: Prepare stable Android release signing key
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          : "${ANDROID_RELEASE_KEYSTORE_BASE64:?missing ANDROID_RELEASE_KEYSTORE_BASE64}"
          : "${ANDROID_RELEASE_KEYSTORE_PASSWORD:?missing ANDROID_RELEASE_KEYSTORE_PASSWORD}"
          : "${ANDROID_RELEASE_KEY_ALIAS:?missing ANDROID_RELEASE_KEY_ALIAS}"
          : "${ANDROID_RELEASE_KEY_PASSWORD:?missing ANDROID_RELEASE_KEY_PASSWORD}"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/codex-remote-release.p12"
          chmod 600 "$RUNNER_TEMP/codex-remote-release.p12"
      - name: Build stable-signed ARM64 release APK
        env:
          ANDROID_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/codex-remote-release.p12
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: cd android && ./gradlew assembleRelease
      - name: Verify Android release signing identity
        run: scripts/verify-android-signing.sh android/app/build/outputs/apk/release/app-release.apk
      - name: Package and checksum
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/Codex-Remote-android-arm64.apk
          (cd artifacts && sha256sum Codex-Remote-android-arm64.apk > Codex-Remote-android-arm64.apk.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            artifacts/Codex-Remote-android-arm64.apk
            artifacts/Codex-Remote-android-arm64.apk.sha256

  ios-simulator:
    needs: verify
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm mobile:sync
      - run: scripts/build-ios-simulator.sh
      - run: scripts/build-ios-unsigned.sh
      - name: Upload iOS build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-diagnostics
          path: artifacts/ios-simulator-build.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator
          path: |
            artifacts/Codex-Remote-iOS-Simulator.zip
            artifacts/Codex-Remote-iOS-Simulator.zip.sha256
            artifacts/Codex-Remote-iOS-unsigned.ipa
            artifacts/Codex-Remote-iOS-unsigned.ipa.sha256

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, android, ios-simulator]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Stage Android download assets
        id: stage_android
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          publish_dir="$RUNNER_TEMP/android-download"
          git init "$publish_dir"
          cd "$publish_dir"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch --depth=1 origin android-download; then
            git checkout -B android-download FETCH_HEAD
          else
            git checkout --orphan android-download
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p "$GITHUB_REF_NAME"
          cp "$GITHUB_WORKSPACE/release-assets/Codex-Remote-android-arm64.apk" "$GITHUB_REF_NAME/"
          cp "$GITHUB_WORKSPACE/release-assets/Codex-Remote-android-arm64.apk.sha256" "$GITHUB_REF_NAME/"
          git add "$GITHUB_REF_NAME"
          if git diff --cached --quiet; then
            asset_commit="$(git rev-parse HEAD)"
          else
            git commit -m "release: publish Android $GITHUB_REF_NAME"
            asset_commit="$(git rev-parse HEAD)"
            git push origin HEAD:android-download
           fi
           echo "commit=$asset_commit" >> "$GITHUB_OUTPUT"
      - name: Create update manifest
        run: |
          jq -n \
            --arg version "${GITHUB_REF_NAME#v}" \
            --arg androidDownloadCommit "${{ steps.stage_android.outputs.commit }}" \
            '{version: $version, androidDownloadCommit: $androidDownloadCommit}' \
            > release-assets/latest.json
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Codex Remote $GITHUB_REF_NAME" \
              --generate-notes
          fi
      - name: Publish Android update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          publish_dir="$RUNNER_TEMP/android-download"
          cd "$publish_dir"
          cp "$GITHUB_WORKSPACE/release-assets/latest.json" latest.json
          git add latest.json
          if ! git diff --cached --quiet; then
            git commit -m "release: update mobile manifest for $GITHUB_REF_NAME"
            git push origin HEAD:android-download
          fi
          for asset in latest.json "$GITHUB_REF_NAME/Codex-Remote-android-arm64.apk" "$GITHUB_REF_NAME/Codex-Remote-android-arm64.apk.sha256"; do
            curl --fail --silent --show-error --retry 5 --retry-all-errors \
              "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@android-download/${asset}" \
              >/dev/null
          done
      - name: Verify published mobile update
        run: |
          version="${GITHUB_REF_NAME#v}"
          asset_commit="${{ steps.stage_android.outputs.commit }}"
          manifest_url="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/latest.json"
          verify_dir="$(mktemp -d)"
          for attempt in $(seq 1 12); do
            if curl --fail --location --silent --show-error "$manifest_url" -o "$verify_dir/latest.json" && \
              jq -e --arg version "$version" --arg commit "$asset_commit" \
                '.version == $version and .androidDownloadCommit == $commit' "$verify_dir/latest.json" >/dev/null; then
              break
            fi
            if [[ "$attempt" == "12" ]]; then
              echo "Published mobile update manifest did not converge" >&2
              exit 1
            fi
            sleep 5
          done
          asset_root="https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@${asset_commit}/${GITHUB_REF_NAME}"
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            "$asset_root/Codex-Remote-android-arm64.apk" \
            -o "$verify_dir/Codex-Remote-android-arm64.apk"
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            "$asset_root/Codex-Remote-android-arm64.apk.sha256" \
            -o "$verify_dir/Codex-Remote-android-arm64.apk.sha256"
          (cd "$verify_dir" && sha256sum -c Codex-Remote-android-arm64.apk.sha256)
