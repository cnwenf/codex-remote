apply plugin: 'com.android.application'

def generatedBrandResDir = layout.buildDirectory.dir('generated/brand-res')
def releaseKeystorePath = System.getenv("ANDROID_RELEASE_KEYSTORE_PATH")
def releaseKeystorePassword = System.getenv("ANDROID_RELEASE_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("ANDROID_RELEASE_KEY_ALIAS")
def releaseKeyPassword = System.getenv("ANDROID_RELEASE_KEY_PASSWORD")
def releaseSigningConfigured = [
    releaseKeystorePath,
    releaseKeystorePassword,
    releaseKeyAlias,
    releaseKeyPassword,
].every { value -> value != null && !value.isBlank() }

tasks.register('generateBrandResources') {
    def source = rootProject.file('../assets/app-icon.png')
    def outputDir = generatedBrandResDir.map { it.dir('drawable-nodpi') }
    inputs.file(source)
    outputs.dir(outputDir)
    doLast {
        def directory = outputDir.get().asFile
        directory.mkdirs()
        def sourceImage = javax.imageio.ImageIO.read(source)
        java.nio.file.Files.copy(source.toPath(), new File(directory, 'ic_launcher_source.png').toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        def smallIcon = new java.awt.image.BufferedImage(96, 96, java.awt.image.BufferedImage.TYPE_INT_ARGB)
        def graphics = smallIcon.createGraphics()
        graphics.setRenderingHint(java.awt.RenderingHints.KEY_INTERPOLATION, java.awt.RenderingHints.VALUE_INTERPOLATION_BICUBIC)
        graphics.drawImage(sourceImage, 0, 0, 96, 96, null)
        graphics.dispose()
        for (int y = 0; y < 96; y++) {
            for (int x = 0; x < 96; x++) {
                int pixel = smallIcon.getRGB(x, y)
                int brightness = Math.round((0.2126f * ((pixel >> 16) & 0xff) + 0.7152f * ((pixel >> 8) & 0xff) + 0.0722f * (pixel & 0xff)) * ((pixel >>> 24) / 255f))
                smallIcon.setRGB(x, y, (brightness << 24) | 0x00ffffff)
            }
        }
        javax.imageio.ImageIO.write(smallIcon, 'png', new File(directory, 'ic_stat_codex_remote.png'))
    }
}

android {
    namespace = "com.cnwenf.codexremote"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.cnwenf.codexremote"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 40
        versionName "0.5.31"
        ndk {
            abiFilters "arm64-v8a"
        }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile file(releaseKeystorePath)
                storeType "PKCS12"
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
        }
    }
    sourceSets.main.res.srcDir(generatedBrandResDir)
}

gradle.taskGraph.whenReady { graph ->
    def releaseTaskRequested = graph.allTasks.any { task ->
        task.project == project && task.name.toLowerCase().contains("release")
    }
    if (releaseTaskRequested && !releaseSigningConfigured) {
        throw new GradleException("Android release signing is not configured. Set all ANDROID_RELEASE_* environment variables.")
    }
}

tasks.named('preBuild').configure {
    dependsOn('generateBrandResources')
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "com.google.android.gms:play-services-code-scanner:16.1.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
